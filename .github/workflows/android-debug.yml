name: Aether Valley Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.res'
      - '**.json'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  export-android-debug:
    name: Export ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages for Godot 4.7
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"

      - name: Set up Godot 4.7.2 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify build toolchain
        run: |
          godot --version
          java -version
          adb version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.1"

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" build/AetherValley-debug.apk
          test -s build/AetherValley-debug.apk

      - name: Verify APK archive and signature
        run: |
          unzip -t build/AetherValley-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/AetherValley-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/AetherValley-debug.apk | head -n 20

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Valley-Android-Debug-APK
          path: build/AetherValley-debug.apk
          if-no-files-found: error
          retention-days: 30
