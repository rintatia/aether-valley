name: Aether Valley V1 production validation

on:
  push:
    branches: [v1/first-playable-production]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  source-and-godot-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static production audit
        run: python tests/static_audit.py
      - name: Validate season data
        run: python -m json.tool data/seasons.json > /dev/null
      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project and SVG assets
        run: godot --headless --editor --path . --quit
      - name: Headless project launch
        run: godot --headless --path . --quit-after 3
      - name: Gameplay regression smoke test
        run: godot --headless --path . --script res://tests/gameplay_smoke.gd
