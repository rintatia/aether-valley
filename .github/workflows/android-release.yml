name: Aether Valley signed Android release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.res'
      - '**.json'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  release-android:
    name: Build signed ARM64 APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_RELEASE_KEY_ALIAS" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_RELEASE_KEYSTORE_PASSWORD" && exit 1)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages for Godot 4.7
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"

      - name: Set up Godot 4.7.2 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Prepare private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aether-valley-release.keystore"
          test -s "$RUNNER_TEMP/aether-valley-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/aether-valley-release.keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/aether-valley-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify toolchain and import project
        run: |
          godot --version
          java -version
          adb version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.1"
          godot --headless --editor --path . --quit

      - name: Install Godot Gradle Android build template
        run: godot --headless --editor --path . --install-android-build-template --quit

      - name: Run gameplay smoke test
        run: godot --headless --path . --script res://tests/gameplay_smoke.gd

      - name: Export signed release APK and AAB
        run: |
          mkdir -p build
          REVISION="r${GITHUB_RUN_NUMBER}"
          APK="build/AetherValley-v1.0.0-${REVISION}-release.apk"
          AAB="build/AetherValley-v1.0.0-${REVISION}-release.aab"
          godot --headless --path . --export-release "Android Release APK" "$APK"
          godot --headless --path . --export-release "Android Release AAB" "$AAB"
          test -s "$APK"
          test -s "$AAB"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

      - name: Verify release packages and signing identity
        run: |
          unzip -t "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK_PATH"
          jarsigner -verify -verbose -certs "$AAB_PATH" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK_PATH" | head -n 20
          sha256sum "$APK_PATH" "$AAB_PATH" | tee build/SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Valley-v1.0.0-r${{ github.run_number }}-Android-Release
          path: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
