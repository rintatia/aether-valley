name: Aether Valley Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [v7]

permissions:
  contents: write

jobs:
  release-apk:
    name: Build signed ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -keystore "$RUNNER_TEMP/av.keystore" -storepass avtemp-pass-1 -keypass avtemp-pass-1 \
            -alias av -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Aether Valley, O=Aether Valley, C=ID"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/av.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=av"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=avtemp-pass-1"
          } >> "$GITHUB_ENV"
      - name: Set version (7.0.0.build.N)
        shell: bash
        run: |
          set -euo pipefail
          VER="7.0.0.build.$GITHUB_RUN_NUMBER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          printf '{"versi": "%s"}\n' "$VER" > data/version.json
          sed -i "s/^version\/name=.*/version\/name=\"$VER\"/; s/^version\/code=.*/version\/code=$((700 + GITHUB_RUN_NUMBER))/" export_presets.cfg
          grep -E "^version/" export_presets.cfg
          cat data/version.json
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Selftest (headless)
        continue-on-error: true
        run: |
          mkdir -p build
          godot --headless --path . -- --selftest 2>&1 | tee build/selftest.log
      - name: Screenshot Godot 4K (layar virtual)
        continue-on-error: true
        run: |
          mkdir -p build/shots && touch build/.gdignore
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          SHOT_DIR="$PWD/build/shots" xvfb-run -a -s "-screen 0 3840x2160x24" godot --path . --rendering-driver opengl3 --resolution 3840x2160 -- --screenshot 2>&1 | tee build/shots.log | tail -20
          SHOT_PREFIX="hp_" SHOT_DIR="$PWD/build/shots" xvfb-run -a -s "-screen 0 2400x1080x24" godot --path . --rendering-driver opengl3 --resolution 2400x1080 -- --screenshot 2>&1 | tee -a build/shots.log | tail -5
          ls -la build/shots

      - name: Export Release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build && touch build/.gdignore
          APK="build/AetherValley-$VER.apk"
          godot --headless --path . --export-release "Android Release APK" "$APK" 2>&1 | tee build/export.log
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      - name: Verify APK
        run: |
          unzip -tq "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK_PATH" | head -n 8
      - name: Publish selftest log to ci-logs branch
        if: always()
        shell: bash
        run: |
          set -e
          cp -r build/shots "$RUNNER_TEMP/shots" 2>/dev/null || true
          cp build/shots.log "$RUNNER_TEMP/shots.log" 2>/dev/null || true
          { cat build/selftest.log; echo ---EXPORT---; cat build/export.log; } > "$RUNNER_TEMP/selftest.log" 2>&1 || true
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/selftest.log" selftest.log
          cp -r "$RUNNER_TEMP/shots" shots 2>/dev/null || true
          cp "$RUNNER_TEMP/shots.log" shots.log 2>/dev/null || true
          git add -A
          git commit -qm "selftest log run $GITHUB_RUN_NUMBER"
          git push -f origin ci-logs
      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VER"
          grep -q "SELFTEST OK" build/selftest.log || { echo "Selftest gagal - tidak dirilis"; exit 1; }
          gh release create "$TAG" "$APK_PATH" --title "Aether Valley $VER" --notes "Versi $VER - APK release arm64 (kunci sementara). Commit: $GITHUB_SHA. Selftest log: branch ci-logs." --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: build/selftest.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-Valley-V7-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
